
name: Dependencies Example

on:
  workflow_dispatch:

jobs:
  dependencies-example:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: List repository files
        run: ls -alhR
